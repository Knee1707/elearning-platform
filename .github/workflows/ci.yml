name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.13.1
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Naming guard (chặn đặt tên sai)
        run: node scripts/naming-guard.mjs --all

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Build cần biến public; dùng giá trị giả để không phụ thuộc secret khi CI.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
