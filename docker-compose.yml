version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning-web
    restart: unless-stopped
    ports:
      # Port 3001 ánh xạ vào container port 3000 để tránh xung đột với các port đang chạy trên máy (như 8080, 5432, 6379, 3000)
      - "${PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder-project.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIn0.dummy-key-for-local-development}
